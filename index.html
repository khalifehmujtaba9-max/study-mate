<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate - منصة الصف الثامن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0b1329; }
    </style>
</head>
<body class="bg-[#0b1329] min-h-screen flex items-center justify-center p-4">

    <!-- Passcode Protected Screen -->
    <div id="passcode-page" class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 text-center space-y-6">
        <div class="w-20 h-20 bg-blue-50 text-[#1e3a8a] rounded-full flex items-center justify-center mx-auto text-3xl shadow-inner">
            <i class="fa-solid fa-lock"></i>
        </div>
        <div>
            <h1 class="text-2xl font-extrabold text-[#1e3a8a]">موقع محمي بكلمة سر</h1>
            <p class="text-slate-400 text-sm mt-1">أدخل رمز الأمان الخاص بالصف الثامن لمتابعة الدخول</p>
        </div>
        <div class="space-y-4">
            <input type="password" id="passcode-input" placeholder="أدخل رمز الأمان (Passcode)" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-[#1e3a8a] focus:outline-none text-center tracking-widest text-lg font-medium text-slate-700 placeholder:text-slate-300">
            <button onclick="checkPasscode()" class="w-full bg-[#0b1329] hover:bg-[#152248] text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-200">
                فتح المنصة
            </button>
            <p id="passcode-error" class="text-red-500 text-sm hidden font-medium">رمز الأمان غير صحيح، حاول مجدداً.</p>
        </div>
    </div>

    <!-- Main Application Container -->
    <div id="main-app" class="hidden min-h-screen w-full bg-slate-100 flex-col">
        <header class="bg-[#0b1329] text-white p-4 shadow-md flex justify-between items-center">
            <h1 class="font-bold text-lg">منصة StudyMate - الصف الثامن</h1>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs transition">تسجيل خروج</button>
        </header>
        <main class="p-6 max-w-4xl mx-auto w-full">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center space-y-4">
                <h2 class="text-xl font-bold text-[#1e3a8a]">أهلاً بك يا مجتبى في منصة الصف الثامن!</h2>
                <p class="text-slate-600">تم تسجيل الدخول بنجاح والمنصة جاهزة بالكامل لخدمة زملائك.</p>
            </div>
        </main>
    </div>

    <script>
        const CORRECT_PASSCODE = "8888"; // رمز الدخول المعتمد

        function checkPasscode() {
            const input = document.getElementById('passcode-input').value;
            const error = document.getElementById('passcode-error');
            if (input === CORRECT_PASSCODE) {
                document.getElementById('passcode-page').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('main-app').classList.add('flex');
                localStorage.setItem('auth', 'true');
            } else {
                error.classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('auth');
            location.reload();
        }

        window.onload = function() {
            if (localStorage.getItem('auth') === 'true') {
                document.getElementById('passcode-page').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('main-app').classList.add('flex');
            }
        }
    </script>
</body>
</html>
